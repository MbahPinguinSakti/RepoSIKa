<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - RepoSIKa</title>
  
  <!-- Jembatan buat narik desain CSS lu. Pastiin nama filenya bener 'style.css' -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="wadah-reset">

    <!-- Form meminta tautan pemulihan -->
    <form id="form-minta-email">
      <p class="teks-instruksi">
        Untuk mereset kata sandi, silakan masukkan alamat email Anda.
        Jika alamat tersebut terdaftar di sistem, instruksi pemulihan
        akan dikirimkan ke kotak masuk Anda.
      </p>

      <div class="grup-input">
        <label for="input-email-reset" class="label-surel">
          Alamat surel
        </label>

        <input
          type="email"
          id="input-email-reset"
          class="kotak-input"
          placeholder="Masukkan alamat email"
          required
        >
      </div>

      <button type="submit" id="btn-cari" class="tombol-cari">
        Kirim Tautan Pemulihan
      </button>
    </form>

    <!-- Form mengganti password setelah tautan pemulihan dibuka -->
    <form id="form-password-baru" style="display: none;">
      <p class="teks-instruksi">
        Buat kata sandi baru untuk akun RepoSIKa Anda.
      </p>

      <div class="grup-input">
        <label for="input-pass-baru" class="label-surel">
          Kata sandi baru
        </label>

        <input
          type="password"
          id="input-pass-baru"
          class="kotak-input"
          placeholder="Minimal 6 karakter"
          minlength="6"
          required
        >
      </div>

      <div class="grup-input">
        <label for="input-pass-konfirmasi" class="label-surel">
          Konfirmasi kata sandi
        </label>

        <input
          type="password"
          id="input-pass-konfirmasi"
          class="kotak-input"
          placeholder="Ulangi kata sandi baru"
          minlength="6"
          required
        >
      </div>

      <button
        type="submit"
        id="btn-simpan-password"
        class="tombol-cari"
      >
        Simpan Kata Sandi Baru
      </button>
    </form>

<p>
  <a href="login.html" class="back-to-login">
    <i class="fa-solid fa-arrow-left"></i>
    Kembali ke halaman login
  </a>
</p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.js"></script>
  <script src="script.js"></script>

</body>
</html>
