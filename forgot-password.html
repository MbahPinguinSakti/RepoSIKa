<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - RepoSIKa</title>
  
  <!-- Jembatan buat narik desain CSS lu. Pastiin nama filenya bener 'style.css' -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Ini perabotan "Ruangan Khusus" yang kita bahas tadi -->
  <div class="wadah-reset">
    <p class="teks-instruksi">
      Untuk mereset kata sandi,Silakan masukkan alamat email atau surel Anda di bawah ini. 
  Jika alamat tersebut terdaftar di sistem, kami akan mengirimkan tautan pemulihan ke kotak masuk Anda.
    </p>
    
    <div class="grup-input">
      <label for="input-email-reset" class="label-surel">Alamat surel</label>
      <input type="email" id="input-email-reset" class="kotak-input">
    </div>
  
    <button id="btn-cari" class="tombol-cari">Cari</button>
  </div>

  <!-- Kabel buat nyambungin ke mesin JS kita nanti -->
  <script src="script.js"></script>

</body>
</html>
