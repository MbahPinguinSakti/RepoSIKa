<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RepoSIKa</title>
    <link rel="stylesheet" href="CSS-login/login.css">
</head>
<body>

    <!-- Panel utama -->
    <div class="page-panel">

        <!-- Logo dan navigasi -->
        <div class="top-header">

            <!-- Logo di luar navbar -->
            <div class="navbar-logos">
                <img
                    src="assets/logo-unsika.png"
                    alt="Logo UNSIKA"
                    class="university-logo"
                >

                <img
                    src="assets/logo-fasilkom.png"
                    alt="Logo Fasilkom"
                    class="faculty-logo"
                >
            </div>

            <!-- Navbar menu -->
            <nav class="navbar">
                <div class="navbar-links">
                    <a href="index.html">Home</a>
                    <a href="#">Services</a>
                    <a href="#">About Us</a>
                    <a href="#">Contact Us</a>
                </div>
            </nav>

        </div>

        <!-- Halaman Login -->
        <main class="login-container">
            <section class="login-card">

                <!-- Logo RepoSIKa -->
                <div class="logo">
                    <img
                        src="assets/logo-reposika.png"
                        alt="Logo RepoSIKa"
                    >
                </div>

                <h1>RepoSIKa</h1>
                <h2>Welcome!</h2>
                <p class="subtitle">Let's Login to Your Account</p>

                <!-- Notifikasi login -->
                <div id="alert-container"></div>

                <!-- Form Login -->
                <form id="form-login">

                    <label for="input-email">Email</label>
                    <input
                        type="email"
                        id="input-email"
                        name="email"
                        placeholder="Masukkan email"
                        autocomplete="email"
                        required
                    >

                    <label for="input-password">Password</label>
                    <input
                        type="password"
                        id="input-password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <!-- Lupa Password -->
                    <a
                        href="forgot-password.html"
                        class="forgot-password"
                    >
                        Forgot Password?
                    </a>

                    <button type="submit" class="signin-button">
                     Masuk
                    </button>

                </form>

                <p class="divider-text">or continue with</p>

                <!-- Tombol Google -->
                <button
                    type="button"
                    class="google-button"
                    id="google-login-btn"
                >
                    <img
                        src="assets/logo-google.png"
                        alt="Logo Google"
                    >
                    Login with Google
                </button>

                <!-- Link ke halaman pendaftaran -->
                <p class="signup-link">
                    Belum punya akun?
                    <a href="signup.html">Daftar di sini</a>
                </p>

                <!-- Privacy Policy -->
                <footer class="login-footer">
                    <a href="#">Privacy Policy</a>
                </footer>

            </section>
        </main>

    </div>




    <!-- Logic autentikasi -->
    <script type="module" src="JS-Login/script.js"></script>

</body>
</html>
