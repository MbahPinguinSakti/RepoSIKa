<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | RepoSIKa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Panel utama -->
    <div class="page-panel">

    <!-- Logo dan navigasi -->
    <div class="top-header">

        <!-- Logo di luar navbar -->
        <div class="navbar-logos">
            <img src="assets/logo-unsika.png"
                 alt="Logo UNSIKA"
                 class="university-logo">

            <img src="assets/logo-fasilkom.png"
                 alt="Logo Fasilkom"
                 class="faculty-logo">
        </div>

        <!-- Navbar menu -->
        <nav class="navbar">
            <div class="navbar-links">
                <a href="#">Home</a>
                <a href="#">Services</a>
                <a href="#">About Us</a>
                <a href="#">Contact Us</a>
            </div>
        </nav>

    </div>


        <!-- Halaman Login -->
        <main class="login-container">
            <section class="login-card">

                <!-- Logo RepoSIKa -->
                <div class="logo">
                    <img
                        src="assets/logo-reposika.png"
                        alt="Logo RepoSIKa"
                    >
                </div>

                <h1>RepoSIKa</h1>
                <h2>Welcome!</h2>
                <p class="subtitle">Let's Login to Your Account</p>

                <!-- Form Login -->
                <!-- Form Login (Udah dibenerin ID-nya) -->
                <form id="form-login">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="input-email"
                        placeholder="Masukkan email"
                        required
                    >

                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="input-password"
                        placeholder="Masukkan password"
                        required
                    >

                    <a href="#" class="forgot-password">Forgot Password?</a>


                    <button type="submit" class="signin-button">
                        Sign In
                    </button>
                </form>

                <p class="divider-text">or continue with</p>

               <!-- Tombol Google (Ditambahkan ID agar mudah dikenali JavaScript) -->
                <button type="button" id="google-login-btn" class="google-button">
                    <img
                        src="assets/logo-google.png"
                        alt="Logo Google"
                    >
                    Login with Google
                </button>

                <!-- Privacy Policy -->
                <footer class="login-footer">
                    <a href="#">Privacy Policy</a>
                </footer>

            </section>
        </main>

    </div>
<!-- 1. Memuat pustaka Supabase Client melalui CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.js"></script>

  <!-- 2. Menghubungkan file JavaScript untuk logika form login -->
  <script src="script.js"></script>
</body>
</html>
