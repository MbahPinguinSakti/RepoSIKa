<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register | RepoSIKa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Panel utama -->
    <div class="page-panel">

        <!-- Logo dan navigasi -->
        <div class="top-header">
            <div class="navbar-logos">
                <img src="assets/logo-unsika.png" alt="Logo UNSIKA" class="university-logo">
                <img src="assets/logo-fasilkom.png" alt="Logo Fasilkom" class="faculty-logo">
            </div>

            <nav class="navbar">
                <div class="navbar-links">
                    <a href="index.html">Home</a>
                    <a href="#">Services</a>
                    <a href="#">About Us</a>
                    <a href="#">Contact Us</a>
                </div>
            </nav>
        </div>

        <!-- Halaman Login & Sign Up -->
        <main class="login-container">
            <section class="login-card">

                <!-- Logo RepoSIKa (Tampil terus buat kedua form) -->
                <div class="logo">
                    <img src="assets/logo-reposika.png" alt="Logo RepoSIKa">
                </div>
                <h1>RepoSIKa</h1>

                <!-- ========================================= -->
                <!-- BAGIAN 1: FORM LOGIN (Tampil Pertama Kali)-->
                <!-- ========================================= -->
                <div id="section-login">
                    <h2>Welcome!</h2>
                    <p class="subtitle">Let's Login to Your Account</p>

                    <div id="alert-container"></div>

                    <form id="form-login">
                        <label for="input-email">Email</label>
                        <input type="email" id="input-email" placeholder="Masukkan email" required>

                        <label for="input-password">Password</label>
                        <input type="password" id="input-password" placeholder="Masukkan password" required>

                        <a href="forgot-password.html" class="forgot-password">Forgot Password?</a>

                        <button type="submit" class="signin-button">Masuk</button>
                    </form>

                    <p class="divider-text">or continue with</p>

                    <button type="button" id="google-login-btn" class="google-button">
                        <img src="assets/logo-google.png" alt="Logo Google">
                        Login with Google
                    </button>
                </div>

                <!-- Privacy Policy (Tampil terus buat kedua form) -->
                <footer class="login-footer">
                    <a href="#">Privacy Policy</a>
                </footer>

            </section>
        </main>

    </div>

    <!-- Pustaka Supabase & Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js/dist/umd/supabase.js"></script>
    <script src="script.js"></script>
</body>
</html>
